<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content (20.08.2026) — на iOS Safari 17.4+/Chrome
         Android заставляет браузер реально сжимать layout viewport под клавиатуру,
         поэтому нижнее меню (Layout.jsx, position:fixed;bottom:0) и панель ИИ-ассистента
         больше не "всплывают" в щели над клавиатурой — фикс на уровне браузера, а не JS. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
    <!-- До официального запуска — не индексировать (см. robots.txt рядом). Убрать, когда продукт готов к публичному поиску. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Безопасный бизнес</title>

    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2A2A2E" />

    <!-- Manrope (24.08.2026, владелец: как на лендинге, не системный шрифт)
         — тот же CDN-подход, что в landing/index.html. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- iOS: своя иконка/заголовок при "Добавить на экран" — без этого
         Safari подставил бы скриншот страницы вместо иконки. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Безопасный бизнес" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
