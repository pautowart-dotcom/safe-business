# Домен business-safe.ru зарегистрирован владельцем (Timeweb) — переезд с
# голого IP. Схема: business-safe.ru/ — лендинг, business-safe.ru/lk/ —
# клиентское приложение (SPA + API), business-safe.ru/office/ — кабинет
# платформы (Задача 1) — отдельный интерфейс для владельца (компании,
# метрики, поддержка), намеренно не смешан с клиентским кабинетом.
#
# История поддоменов (для контекста, если снова возникнут похожие симптомы):
# сначала были app./admin., их переименовали в lk./office. — провайдерская
# фильтрация в РФ блокировала имена по SNI (не по IP: смена floating IP не
# помогала, а голый business-safe.ru работал всегда). Переименование не
# решило проблему окончательно (31.07.2026: business-safe.ru/lk/ снова не
# проходит у всех операторов РФ, лендинг — всегда проходит) — поэтому теперь
# вместо гонки с именами поддоменов всё живёт на одном хосте business-safe.ru,
# части различаются путём. Путь внутри HTTPS-запроса DPI не видит (в отличие
# от SNI в TLS ClientHello) — так что для фильтра business-safe.ru/lk/
# неотличим от уже подтверждённо рабочего business-safe.ru/.
#
# Сертификаты — через `certbot certonly --nginx`,
# НЕ через `certbot --nginx` — тот сам переписывает этот файл, а deploy.sh
# каждый раз перезаписывает /etc/nginx/sites-available из репозитория,
# и правки certbot потерялись бы при следующем деплое. certonly только
# выпускает/обновляет файлы сертификата по путям ниже — сам nginx.conf
# остаётся источником истины в git.
#
# Сертификат нужен только на business-safe.ru/www — отдельные SAN для
# lk./office. больше не требуются (31.07.2026: ушли от поддоменов на пути,
# см. комментарий выше). Если в сертификате остались старые -d на lk./office.
# — не мешают, можно убрать при следующем продлении, не обязательно сейчас:
#   certbot certonly --nginx -d business-safe.ru -d www.business-safe.ru
#
# ВАЖНО: раз для business-safe.ru уже существовала директория сертификата,
# certbot не переиспользовал её, а завёл новую — business-safe.ru-0001
# (обнаружено 25.07.2026 поддержкой Timeweb после того, как расширенный
# сертификат "потерялся": nginx.conf в git всё ещё указывал на путь без
# -0001). Пути ниже — на -0001, это правильная актуальная директория.
# Если когда-нибудь снова "потеряется" сертификат — сначала проверить
# `certbot certificates`, какая директория реально используется.

server {
    listen 80;
    server_name business-safe.ru www.business-safe.ru;
    return 301 https://business-safe.ru$request_uri;
}

server {
    # http2 — важно не только для скорости: HTTP/1.1 открывает по 6+
    # параллельных TCP/TLS-соединений на страницу (по одному на файл),
    # HTTP/2 мультиплексирует всё через одно соединение. С июня 2026 ТСПУ
    # РКН начал блокировать клиента на 120 секунд именно за много
    # TLS-хендшейков подряд с одного адреса — воспринимает это как
    # туннелирование/DDoS. Лендинг (один файл) под порог не попадал,
    # /lk/ (бандл + CSS + несколько запросов к API) — попадал.
    listen 443 ssl http2;
    server_name business-safe.ru www.business-safe.ru;

    ssl_certificate     /etc/letsencrypt/live/business-safe.ru-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/business-safe.ru-0001/privkey.pem;

    # 8M — под загрузку фото визита/документа (multer лимит в
    # core/uploads.js согласован с этим значением, см. Этап 4 и баг из
    # раздела "Документы"). Общий лимит на сервер — грузят и из /lk/, и из
    # /office/.
    client_max_body_size 8M;

    # API — общий бэкенд для клиентского приложения (/lk/) и кабинета
    # платформы (/office/). ^~ гарантирует, что запрос сюда не попадёт под
    # regex-локации кэширования статики ниже (см. их комментарий).
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Вложения к обращению в поддержку (09.08.2026) — фото/видео тяжелее
    # обычных загрузок (8M общего лимита выше), но лимит поднят только для
    # этого пути, не для всего /api/ сразу — более специфичная location с
    # ^~ побеждает общую /api/ у nginx независимо от порядка в файле.
    # multer-лимит согласован в core/uploads.js (uploadSupportAttachments).
    location ^~ /api/platform/support/ {
        client_max_body_size 25M;
        proxy_pass http://127.0.0.1:4000/api/platform/support/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Клиентское приложение (SPA), бывший lk.business-safe.ru — теперь путь
    # /lk/ на том же хосте, что и лендинг (см. комментарий в начале файла).
    #
    # Баг-класс "код правильный, а в браузере всё равно старое поведение":
    # без явного Cache-Control браузер (особенно в PWA/standalone) мог
    # годами держать старый index.html, который ссылается на старые,
    # давно удалённые JS/CSS-файлы прошлой сборки — после деплоя человек
    # видит код недельной давности, хотя на сервере уже новый. index.html
    # всегда перепроверяется у сервера; сами файлы сборки (у них в имени
    # хэш содержимого — Vite меняет имя при каждом изменении кода) можно
    # кэшировать вечно без риска отдать устаревшее.
    location = /lk/index.html {
        alias /var/www/safe-business/frontend/dist/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    # sw.js — единственный не хэшируемый .js в сборке (Vite его не трогает,
    # он лежит в public/ как есть), и именно поэтому НЕ должен попадать под
    # годовой Cache-Control ниже — иначе браузер до года не подхватит
    # изменения в обработчике push-уведомлений. Точное совпадение проверяется
    # раньше regex-локации (см. её комментарий), так что заведомо исключает
    # его оттуда независимо от порядка блоков в файле.
    location = /lk/sw.js {
        rewrite ^/lk/(.*)$ /$1 break;
        root /var/www/safe-business/frontend/dist;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    # version.json — сверяется с версией, вшитой в уже загруженный бандл
    # (utils/versionCheck.js), чтобы standalone/PWA сам понял про обновление
    # и перезагрузился, без ручного удаления с "Домой". Должен всегда
    # доходить до сервера, поэтому без кэша, как index.html выше.
    location = /lk/version.json {
        rewrite ^/lk/(.*)$ /$1 break;
        root /var/www/safe-business/frontend/dist;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    # alias с regex-локацией требует capture-групп в самом alias — здесь
    # они не нужны (не меняем имя файла), поэтому вместо alias используем
    # rewrite+root: снимаем префикс /lk/ и отдаём из frontend/dist как есть.
    location ~* ^/lk/.+\.(?:js|css|woff2?|ttf|png|jpg|jpeg|svg|ico)$ {
        rewrite ^/lk/(.*)$ /$1 break;
        root /var/www/safe-business/frontend/dist;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /lk/ {
        alias /var/www/safe-business/frontend/dist/;
        try_files $uri $uri/ /lk/index.html;
    }

    # Кабинет платформы (SPA), бывший office.business-safe.ru — путь
    # /office/. Та же логика кэша и rewrite, что и у /lk/ выше.
    #
    # noindex здесь остаётся навсегда, не привязан к готовности продукта к
    # публичному поиску (21.08.2026, снят общий запрет индексации для всего
    # сайта, но /office/ — внутренняя админка, не клиентский контент, её не
    # должно быть в поиске никогда). Сам по себе noindex — не защита доступа,
    # это по-прежнему только requireSuperAdmin на бэкенде.
    location = /office/index.html {
        alias /var/www/safe-business/admin-frontend/dist/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ~* ^/office/.+\.(?:js|css|woff2?|ttf|png|jpg|jpeg|svg|ico)$ {
        rewrite ^/office/(.*)$ /$1 break;
        root /var/www/safe-business/admin-frontend/dist;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location /office/ {
        alias /var/www/safe-business/admin-frontend/dist/;
        try_files $uri $uri/ /office/index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Лендинг — корень домена, единственный хост, который провайдеры РФ
    # ни разу не блокировали (см. комментарий в начале файла). Должен идти
    # последним: location / — самый общий префикс, не должен перехватывать
    # /api/, /lk/, /office/ выше себя.
    root /var/www/safe-business/landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Временно оставлено для обратной совместимости — переводит заход по голому
# IP на домен. Убрать, когда все старые ссылки (приглашения и т.п.) точно
# перестанут использоваться.
server {
    listen 80 default_server;
    server_name 89.23.100.252;
    return 301 https://business-safe.ru$request_uri;
}
